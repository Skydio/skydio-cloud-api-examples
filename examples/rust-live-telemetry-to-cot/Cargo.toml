[package]
name = "rust-live-telemetry-to-cot"
version = "0.1.0"
edition = "2021"
publish = false
description = "Skydio live telemetry to TAK Cursor on Target, using the uas-cot crate."

[dependencies]
# uas-cot maps drone telemetry to CoT 2.0 and writes the XML that ATAK,
# WinTAK and TAK Server accept. Maintained by Matthew Busel.
# https://crates.io/crates/uas-cot
uas-cot = { version = "0.6", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
